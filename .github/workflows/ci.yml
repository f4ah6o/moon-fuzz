name: P0 tests
on:
  push:
  pull_request:
jobs:
  node:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - name: Install pinned MoonBit toolchain and core
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- '0.10.17+d971670cd'
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Build and test the MoonBit target
        run: npm run test:moonbit
